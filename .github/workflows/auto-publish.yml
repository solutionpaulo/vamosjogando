name: Auto Publish AI Article

on:
  schedule:
    # Noticias 2x ao dia: 08:00, 16:00 (Horário de Brasília = UTC-3)
    - cron: '0 11,19 * * *'
    # Review de hardware 1x ao dia: 12:00 (Horário de Brasília = UTC-3)
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      generate_news:
        description: 'Gerar notícias'
        type: boolean
        default: true
      generate_review:
        description: 'Gerar review'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: auto-publish-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  publish-news:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.generate_news) ||
      (github.event_name == 'schedule' && github.event.schedule != '0 15 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Auto Publisher
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run generate

      - name: Commit and push new articles
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [ -n "$(git status --porcelain src/content/blog/ src/assets/)" ]; then
            git add src/content/blog/ src/assets/
            git commit -m "feat(content): artigo automatico $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
            echo "generated=true" >> "$GITHUB_OUTPUT"
            echo "Novos posts e imagens commitados e enviados!"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "Nenhum post novo gerado neste ciclo."
          fi

      - name: Verify and fix post images
        if: steps.commit.outputs.generated == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run fix-images

      - name: Commit image fixes
        if: steps.commit.outputs.generated == 'true'
        run: |
          if [ -n "$(git status --porcelain src/content/blog/ src/assets/)" ]; then
            git add src/content/blog/ src/assets/
            git commit -m "fix(content): imagens revisadas e corrigidas $(date +'%Y-%m-%d %H:%M')" || true
            git pull --rebase
            git push
            echo "Imagens corrigidas commitadas e enviadas!"
          fi

      - name: Generate social media posts
        if: steps.commit.outputs.generated == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run social

      - name: Commit social posts
        if: steps.commit.outputs.generated == 'true'
        run: |
          if [ -n "$(git status --porcelain src/content/social/)" ]; then
            git add src/content/social/
            git commit -m "feat(social): posts de divulgacao $(date +'%Y-%m-%d %H:%M')" || true
            git pull --rebase
            git push
            echo "Posts sociais commitados e enviados!"
          fi

  publish-review:
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.generate_review) ||
      github.event.schedule == '0 15 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Hardware Review
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run review

      - name: Commit and push review
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [ -n "$(git status --porcelain src/content/blog/ src/assets/)" ]; then
            git add src/content/blog/ src/assets/
            git commit -m "feat(review): review de hardware $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
            echo "generated=true" >> "$GITHUB_OUTPUT"
            echo "Review commitada e enviada!"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma review gerada neste ciclo."
          fi

      - name: Verify and fix post images
        if: steps.commit.outputs.generated == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run fix-images

      - name: Commit image fixes
        if: steps.commit.outputs.generated == 'true'
        run: |
          if [ -n "$(git status --porcelain src/content/blog/ src/assets/)" ]; then
            git add src/content/blog/ src/assets/
            git commit -m "fix(content): imagens revisadas e corrigidas $(date +'%Y-%m-%d %H:%M')" || true
            git pull --rebase
            git push
            echo "Imagens corrigidas commitadas e enviadas!"
          fi

  deploy:
    needs: [publish-news, publish-review]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Astro
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4