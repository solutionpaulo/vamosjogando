name: Auto Publish AI Article

on:
  schedule:
    # Noticias 4x ao dia: 00:00, 06:00, 12:00, 18:00 (Horário de Brasília)
    - cron: '0 3,9,15,21 * * *'
    # Review de hardware 1x ao dia: 09:00 (Horário de Brasília)
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Auto Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run generate

      - name: Commit and push new articles
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if [ -n "$(git status --porcelain src/content/blog/ src/assets/)" ]; then
            git add src/content/blog/ src/assets/
            git commit -m "Auto: Novo artigo publicado via IA"
            git push
            echo "Novos posts e imagens commitados e enviados!"
          else
            echo "Nenhum post novo gerado neste ciclo."
          fi

  publish-review:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 12 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Hardware Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run review

      - name: Commit and push review
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if [ -n "$(git status --porcelain src/content/blog/ src/assets/)" ]; then
            git add src/content/blog/ src/assets/
            git commit -m "Auto: Nova review de hardware publicada via IA"
            git push
            echo "Review commitada e enviada!"
          else
            echo "Nenhuma review gerada neste ciclo."
          fi
