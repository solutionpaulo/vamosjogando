name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    # trigger: updated

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Clean dist folder completely
        run: |
          echo "=== Step 1: Removing dist folder ==="
          rm -rf dist
          echo "=== Step 2: Installing dependencies ==="
          npm ci
          echo "=== Step 3: Building Astro do-zero ==="
          npm run build
          echo "=== Step 4: Removing ALL symlinks and fixing permissions ==="
          find dist -type l -delete 2>/dev/null
          find dist -type f -links +1 -delete 2>/dev/null
          chmod -R u+rw,go-w dist 2>/dev/null
          chmod 755 dist 2>/dev/null
          echo "=== Step 5: Verifying no links remain ==="
          ln_count=$(find dist -type l 2>/dev/null | wc -l)
          echo "Symlinks: $ln_count"
          hl_count=$(find dist -type f -links +1 2>/dev/null | wc -l)
          echo "Hardlinks > 1: $hl_count"
          if [ "$ln_count" -gt 0 ] || [ "$hl_count" -gt 0 ]; then
            echo "WARNING: Links found, attempting cleanup..."
            find dist -type l -delete 2>/dev/null
            find dist -type f -links +1 -delete 2>/dev/null
          fi
          echo "=== Step 6: Listing ALL dist files with attributes ==="
          ls -laR dist/ | head -50
          echo "=== Listing large folders ==="
          du -sh dist/*/ 2>/dev/null | sort -rh | head -10

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
          ignore-permissions: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        env:
          NODE_NO_WARNINGS: 1
        uses: actions/deploy-pages@v4