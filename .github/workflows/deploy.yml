name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Clean dist folder completely
        run: |
          echo "=== Step 1: Removing dist folder ==="
          rm -rf dist
          echo "=== Step 2: Installing dependencies ==="
          npm ci
          echo "=== Step 3: Building Astro do-zero ==="
          npm run build
          echo "=== Step 4: Cleaning symlinks from dist ==="
          find dist -type l -delete 2>/dev/null || echo "No symlinks found"
          echo "=== Step 5: Listing ALL dist files with attributes ==="
          ls -laR dist/ | head -100
          echo "=== Finding ALL symlinks ==="
          find dist -type l -ls 2>/dev/null | head -10
          echo "=== Finding hardlinks per file ==="
          find dist -type f -links +1 -ls 2>/dev/null | head -10
          echo "=== Counting hidden files ==="
          find dist -name ".*" -not -name "." -not -name ".." | wc -l
          echo "=== Total files in dist ==="
          find dist -type f | wc -l
          echo "=== Listing large folders ==="
          du -sh dist/*/ 2>/dev/null | sort -rh | head -10

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        env:
          NODE_NO_WARNINGS: 1
        uses: actions/deploy-pages@v4