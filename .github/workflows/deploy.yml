name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Clean dist folder completely
        run: |
          echo "=== Step 1: Removing dist folder ==="
          rm -rf dist
          echo "=== Step 2: Installing dependencies ==="
          npm ci
          echo "=== Step 3: Building Astro do-zero ==="
          npm run build
          echo "=== Step 4: Removing ALL symlinks and fixing permissions ==="
          find dist -type l -delete 2>/dev/null
          find dist -type f -links +1 -delete 2>/dev/null
          # Additional: force-remove any remaining symlinks by re-scanning
          find dist -type l 2>/dev/null | while read link; do rm -f "$link" 2>/dev/null; done
          # Remove any files that still have multiple hard links
          find dist -type f -links +1 -delete 2>/dev/null
          # Reset all permissions and reset uid/gid to break any stale references
          chmod -R u+rw,go-w dist 2>/dev/null
          chmod 755 dist 2>/dev/null
          # Final scan: delete any newly found symlinks
          find dist -type l -delete 2>/dev/null
          # Verify and report
          ln_count=$(find dist -type l 2>/dev/null | wc -l)
          echo "Symlinks remaining: $ln_count"
          hl_count=$(find dist -type f -links +1 2>/dev/null | wc -l)
          echo "Hardlinks > 1 remaining: $hl_count"
          if [ "$ln_count" -gt 0 ] || [ "$hl_count" -gt 0 ]; then
            echo "ERROR: Links still present in dist folder!"
            find dist -type l -exec ls -la {} \; 2>/dev/null
            find dist -type f -links +1 -exec ls -la {} \; 2>/dev/null
            exit 1
          fi
          echo "=== Step 5: Verified - no links in dist folder ==="

      - name: Create clean artifact copy
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          
          # Create clean copy directory
          rm -rf /tmp/dist_clean
          mkdir -p /tmp/dist_clean
          
          # Copy ONLY regular files from dist, preserving directory structure.
          # For each file, compute the relative path and copy to the same location
          # in the clean copy, explicitly skipping all symlinks.
          # --no-preserve=links ensures we never preserve link properties.
          find dist -type f -print0 | while IFS= read -r -d '' file; do
            rel_path="${file#dist/}"
            cp -a --no-preserve=links "$file" "/tmp/dist_clean/$rel_path"
          done
          
          # Remove any symlinks that might exist in the clean copy (safety net)
          find /tmp/dist_clean -type l -delete 2>/dev/null || true
          
          # Verify the clean copy has no symlinks before deploying
          ln_count=$(find /tmp/dist_clean -type l 2>/dev/null | wc -l)
          echo "Symlinks in clean artifact copy: $ln_count"
          if [ "$ln_count" -gt 0 ]; then
            echo "ERROR: Symlinks found in clean artifact copy!"
            find /tmp/dist_clean -type l -exec ls -la {} \; 2>/dev/null
            exit 1
          fi
          
          # Remove original dist and rename clean copy
          rm -rf dist
          mv /tmp/dist_clean dist

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
          ignore-permissions: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        env:
          NODE_NO_WARNINGS: 1
        uses: actions/deploy-pages@v4