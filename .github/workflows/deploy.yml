name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Verify dist folder
        run: |
          echo "=== Dist folder size ==="
          du -sh dist
          echo "=== Checking for symlinks ==="
          find dist -type l | wc -l
          echo "=== Listing dist contents ==="
          ls -la dist/ | head -30

      - name: Remove symlinks from dist
        run: |
          find dist -type l -delete 2>/dev/null || echo "No symlinks to remove"
          echo "=== Symlinks removed ==="

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        env:
          NODE_NO_WARNINGS: 1
        uses: actions/deploy-pages@v4